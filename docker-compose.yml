services:
  app:
    container_name: dn-search-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-138.2.86.218}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-companies}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-yourpassword}
